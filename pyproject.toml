[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-bot"
version = "0.1.0"
description = "Opening Range Breakout (ORB) day-trading bot for ES futures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.28",   # FMP + Alpaca REST data providers
]

[project.optional-dependencies]
# Live trading via Interactive Brokers. Install with: pip install -e ".[ibkr]"
ibkr = ["ib_async>=1.0.0"]
dev = ["pytest>=7.0"]

[project.scripts]
orb-bot = "orb_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
